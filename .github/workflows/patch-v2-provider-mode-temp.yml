name: Temporary provider mode safety patch

on:
  push:
    branches:
      - rebuild/commerce-v2-provider-readiness

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/commerce-v2-provider-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/routes/commerce.v2.checkout.routes.ts')
          text = path.read_text()

          old_import = "import { getOrderViewV2 } from '../commerce/orderViewV2.js';\n"
          new_import = old_import + "import { providerMode } from '../commerce/providerReadiness.js';\n"
          if text.count(old_import) != 1:
              raise SystemExit('provider mode import anchor did not match exactly once')
          text = text.replace(old_import, new_import, 1)

          anchor = """      if (!env.ENABLE_DIGIFLAZZ || !env.DIGIFLAZZ_USERNAME || !env.DIGIFLAZZ_API_KEY) {
        throw new AppError(
          'SERVICE_UNAVAILABLE',
          'Digiflazz must be configured before accepting paid digital orders.',
          503,
        );
      }

      const cartId"""
          replacement = """      if (!env.ENABLE_DIGIFLAZZ || !env.DIGIFLAZZ_USERNAME || !env.DIGIFLAZZ_API_KEY) {
        throw new AppError(
          'SERVICE_UNAVAILABLE',
          'Digiflazz must be configured before accepting paid digital orders.',
          503,
        );
      }
      const mode = providerMode({
        commerceEnabled: env.ENABLE_COMMERCE,
        paymentsEnabled: env.ENABLE_PAYMENTS,
        midtransConfigured: Boolean(env.MIDTRANS_SERVER_KEY),
        midtransProduction: env.MIDTRANS_IS_PRODUCTION,
        digiflazzEnabled: env.ENABLE_DIGIFLAZZ,
        digiflazzConfigured: Boolean(env.DIGIFLAZZ_USERNAME && env.DIGIFLAZZ_API_KEY),
        digiflazzTesting: env.DIGIFLAZZ_TESTING,
        databaseConfigured: Boolean(env.DATABASE_URL),
        sessionSecretConfigured: Boolean(process.env.COMMERCE_SESSION_SECRET),
        adminKeyConfigured: Boolean(env.ADMIN_API_KEY),
      });
      if (mode === 'mismatch') {
        throw new AppError(
          'SERVICE_UNAVAILABLE',
          'Midtrans and Digiflazz environments must both use sandbox/testing or both use production.',
          503,
        );
      }

      const cartId"""
          if text.count(anchor) != 1:
              raise SystemExit('provider mode guard anchor did not match exactly once')
          path.write_text(text.replace(anchor, replacement, 1))
          PY
      - run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write src/routes/commerce.v2.checkout.routes.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/commerce.v2.checkout.routes.ts
          git commit -m "fix: block mixed Midtrans and Digiflazz environments"
          git push origin HEAD:rebuild/commerce-v2-provider-readiness
