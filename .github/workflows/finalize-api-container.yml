name: One-time API Container Finalizer

on:
  push:
    branches: [feat/commerce-core-production]
    paths: [.github/workflows/finalize-api-container.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commerce-core-production
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Refresh lockfile
        run: pnpm install --lockfile-only
      - name: Format production runtime files
        run: |
          pnpm exec prettier --write \
            package.json \
            src/server.ts \
            docs/commerce-production-deployment.md
      - name: Commit finalization
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            pnpm-lock.yaml \
            src/server.ts \
            docs/commerce-production-deployment.md
          git commit -m "build(api): finalize production container runtime"
          git pull --rebase origin feat/commerce-core-production
          git push origin HEAD:feat/commerce-core-production
