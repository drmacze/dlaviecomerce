name: Temporary v2 checkout formatter

on:
  push:
    branches:
      - rebuild/commerce-v2-checkout-fulfillment

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/commerce-v2-checkout-fulfillment
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/routes/commerce.v2.checkout.routes.ts
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/commerce.v2.checkout.routes.ts
          git commit -m "style: format hardened Commerce v2 checkout"
          git push origin HEAD:rebuild/commerce-v2-checkout-fulfillment
