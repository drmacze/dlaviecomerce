name: One-time Neon Lockfile Update

on:
  pull_request:
    branches: [feat/commerce-admin-dashboard]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: update-neon-lock-once
  cancel-in-progress: true

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vercel-neon-embedded-commerce
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build(vercel): lock root PostgreSQL dependencies" || exit 0
          git pull --rebase origin feat/vercel-neon-embedded-commerce
          git push origin HEAD:feat/vercel-neon-embedded-commerce
