name: Temporary Commerce Formatter

on:
  push:
    branches: [feat/commerce-core-production]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/commerce-core-production

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format commerce changes
        run: |
          pnpm exec prettier --write --ignore-unknown \
            README.md \
            src/commerce/midtrans.ts \
            src/commerce/security.ts \
            src/commerce/validation.ts \
            src/config/env.ts \
            src/lib/errors.ts \
            src/routes/commerce.admin.routes.ts \
            src/routes/commerce.cart.routes.ts \
            src/routes/commerce.catalog.routes.ts \
            src/routes/commerce.checkout.routes.ts \
            src/routes/commerce.webhook.routes.ts \
            src/routes/health.routes.ts \
            src/app.ts \
            src/middleware/commerceAdmin.ts \
            lib/db/src/index.ts \
            lib/db/src/schema/commerce.ts \
            lib/db/src/schema/index.ts \
            tests/commerce.security.test.ts \
            tests/health.test.ts \
            tests/midtrans.test.ts \
            tests/validation.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src lib/db/src tests
          git commit -m "style: format commerce implementation"
          git push origin HEAD:feat/commerce-core-production
