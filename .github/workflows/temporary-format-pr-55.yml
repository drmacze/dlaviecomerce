name: Temporary format PR 55

on:
  push:
    branches:
      - feat/onboarding-localization-refinement

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/onboarding-localization-refinement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.28.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/www/app/shop/page.tsx apps/www/app/layout.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/www/app/shop/page.tsx apps/www/app/layout.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: apply repository formatting"
            git push origin HEAD:feat/onboarding-localization-refinement
          fi
