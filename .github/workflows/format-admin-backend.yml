name: One-time Admin Backend Schema Alignment

on:
  push:
    branches: [feat/commerce-core-production]
    paths: [.github/workflows/format-admin-backend.yml]

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commerce-core-production
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Align read models with schema
        run: |
          python - <<'PY'
          from pathlib import Path

          read_path = Path('src/routes/commerce.admin.read.routes.ts')
          read_text = read_path.read_text()
          read_text = read_text.replace('inventoryTable.lowStockThreshold', 'inventoryTable.reorderLevel')
          read_text = read_text.replace(
              '.orderBy(asc(shippingMethodsTable.sortOrder), asc(shippingMethodsTable.name))',
              '.orderBy(asc(shippingMethodsTable.name))',
          )
          read_text = read_text.replace(
              'paidAt: paymentsTable.paidAt,',
              'terminalProcessedAt: paymentsTable.terminalProcessedAt,',
          )
          read_path.write_text(read_text)

          validation_path = Path('src/commerce/validation.ts')
          validation_text = validation_path.read_text()
          validation_text = validation_text.replace(
              "export const productPatchSchema = productInputSchema\n  .partial()\n  .refine((value) => Object.keys(value).length > 0, 'At least one field is required.');",
              "export const productPatchSchema = productInputSchema\n  .partial()\n  .extend({ categoryId: uuidSchema.nullable().optional() })\n  .refine((value) => Object.keys(value).length > 0, 'At least one field is required.');",
          )
          validation_path.write_text(validation_text)

          admin_path = Path('src/routes/commerce.admin.routes.ts')
          admin_text = admin_path.read_text().replace(
              "actor: 'admin-api-key',",
              "actor: request.user ? `user:${request.user.id}` : 'admin-api-key',",
          )
          admin_path.write_text(admin_text)
          PY
          pnpm exec prettier --write \
            src/commerce/validation.ts \
            src/routes/commerce.admin.read.routes.ts \
            src/routes/commerce.admin.routes.ts
      - name: Commit alignment
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/commerce/validation.ts \
            src/routes/commerce.admin.read.routes.ts \
            src/routes/commerce.admin.routes.ts
          git commit -m "fix(commerce): align admin read models with schema"
          git push origin HEAD:feat/commerce-core-production
