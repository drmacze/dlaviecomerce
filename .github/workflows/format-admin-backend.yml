name: One-time Admin Backend Formatter

on:
  push:
    branches: [feat/commerce-core-production]
    paths: [.github/workflows/format-admin-backend.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commerce-core-production
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format admin backend files
        run: |
          pnpm exec prettier --write \
            src/app.ts \
            src/middleware/commerceAdmin.ts \
            src/routes/commerce.admin.read.routes.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.ts src/middleware/commerceAdmin.ts src/routes/commerce.admin.read.routes.ts
          git commit -m "style(commerce): format admin backend"
          git push origin HEAD:feat/commerce-core-production
