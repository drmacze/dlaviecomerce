name: One-time Admin Dashboard Formatter

on:
  push:
    branches: [feat/commerce-admin-dashboard]
    paths: [.github/workflows/format-admin-dashboard.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commerce-admin-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format admin dashboard files
        run: |
          pnpm exec prettier --write \
            apps/www/app/admin \
            apps/www/app/api/admin \
            apps/www/src/admin \
            apps/www/src/components/admin \
            apps/www/src/styles/admin.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/www/app/admin \
            apps/www/app/api/admin \
            apps/www/src/admin \
            apps/www/src/components/admin \
            apps/www/src/styles/admin.css
          git commit -m "style(admin): format operations console"
          git push origin HEAD:feat/commerce-admin-dashboard
