name: One-time Admin Dashboard Schema Alignment

on:
  push:
    branches: [feat/commerce-admin-dashboard]
    paths: [.github/workflows/format-admin-dashboard.yml]

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commerce-admin-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Align dashboard contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          client_path = Path('apps/www/src/admin/client.ts')
          client_text = client_path.read_text()
          client_text = client_text.replace(
              '}): Promise<AdminProductDetail> {\n  const response = await request<{ data: AdminProductDetail }>(adminPath(\'/products\'),',
              '}): Promise<{ id: string }> {\n  const response = await request<{ data: { id: string } }>(adminPath(\'/products\'),',
          )
          client_text = client_text.replace(
              '    categoryId: string;\n    name: string;\n    slug: string;\n    description: string;\n    status: ProductStatus;',
              '    categoryId: string | null;\n    name: string;\n    slug: string;\n    description: string;\n    status: ProductStatus;',
          )
          client_path.write_text(client_text)

          editor_path = Path('apps/www/src/components/admin/AdminProductEditor.tsx')
          editor_text = editor_path.read_text().replace(
              '        ...(categoryId ? { categoryId } : {}),',
              '        categoryId: categoryId || null,',
          )
          editor_path.write_text(editor_text)

          order_path = Path('apps/www/src/components/admin/AdminOrderDetail.tsx')
          order_text = order_path.read_text().replace(
              'formatDateTime(payment.paidAt)',
              'formatDateTime(payment.terminalProcessedAt)',
          )
          order_path.write_text(order_text)
          PY
          pnpm exec prettier --write \
            apps/www/src/admin/client.ts \
            apps/www/src/admin/types.ts \
            apps/www/src/components/admin/AdminProductEditor.tsx \
            apps/www/src/components/admin/AdminOrderDetail.tsx
      - name: Commit alignment
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/www/src/admin/client.ts \
            apps/www/src/admin/types.ts \
            apps/www/src/components/admin/AdminProductEditor.tsx \
            apps/www/src/components/admin/AdminOrderDetail.tsx
          git commit -m "fix(admin): align dashboard contracts with schema"
          git push origin HEAD:feat/commerce-admin-dashboard
