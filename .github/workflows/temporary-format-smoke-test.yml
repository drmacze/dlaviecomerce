name: Temporary Smoke Test Formatter

on:
  push:
    branches: [feat/commerce-core-production]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/commerce-core-production

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format smoke test
        run: pnpm exec prettier --write tests/commerce.smoke.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Smoke test is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/commerce.smoke.ts
          git commit -m "style: format commerce smoke test"
          git push origin HEAD:feat/commerce-core-production
