name: Temporary Commerce v2 formatter

on:
  push:
    branches:
      - rebuild/commerce-v2-checkout-fulfillment

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/commerce-v2-checkout-fulfillment
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          src/commerce/fulfillment.ts
          src/routes/commerce.v2.checkout.routes.ts
          src/routes/commerce.v2.fulfillment.routes.ts
          src/routes/commerce.v2.webhook.routes.ts
          lib/db/src/schema/commerce-v2.ts
      - run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/commerce/fulfillment.ts src/routes/commerce.v2.checkout.routes.ts src/routes/commerce.v2.fulfillment.routes.ts src/routes/commerce.v2.webhook.routes.ts lib/db/src/schema/commerce-v2.ts
          git commit -m "style: format Commerce v2 transaction pipeline"
          git push origin HEAD:rebuild/commerce-v2-checkout-fulfillment
