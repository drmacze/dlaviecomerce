name: Temporary Commerce v2 safety patch

on:
  push:
    branches:
      - rebuild/commerce-v2-checkout-fulfillment

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/commerce-v2-checkout-fulfillment
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          checkout_path = Path('src/routes/commerce.v2.checkout.routes.ts')
          checkout = checkout_path.read_text()
          checkout = replace_once(
              checkout,
              "  gte,\n  inventoryMovementsTable,",
              "  gte,\n  inArray,\n  inventoryMovementsTable,",
              'checkout import inArray',
          )
          checkout = replace_once(
              checkout,
              """    await tx
      .update(providerFulfillmentsTable)
      .set({ status: 'cancelled', updatedAt: new Date() })
      .where(eq(providerFulfillmentsTable.orderId, orderId));""",
              """    await tx
      .update(providerFulfillmentsTable)
      .set({ status: 'cancelled', nextAttemptAt: null, updatedAt: new Date() })
      .where(
        and(
          eq(providerFulfillmentsTable.orderId, orderId),
          inArray(providerFulfillmentsTable.status, [
            'waiting_payment',
            'pending',
            'processing',
            'retrying',
          ]),
        ),
      );""",
              'checkout cancellation filter',
          )
          checkout = replace_once(
              checkout,
              """      const idempotencyKey = idempotencyKeySchema.parse(requiredHeader(request, 'idempotency-key'));
      const input = checkoutInputSchema.parse(request.body);
      const cartTokenHash = hashSecret(cartToken);
      const idempotencyHash = hashSecret(idempotencyKey);""",
              """      const idempotencyKey = idempotencyKeySchema.parse(requiredHeader(request, 'idempotency-key'));
      const orderAccessToken = idempotencyKeySchema.parse(
        requiredHeader(request, 'x-order-access-token'),
      );
      const input = checkoutInputSchema.parse(request.body);
      const cartTokenHash = hashSecret(cartToken);
      const idempotencyHash = hashSecret(idempotencyKey);
      const orderAccessHash = hashSecret(orderAccessToken);""",
              'checkout order access token',
          )
          checkout = replace_once(
              checkout,
              "return { data: await getOrderViewV2(existing.orderNumber, idempotencyKey) };",
              "return { data: await getOrderViewV2(existing.orderNumber, orderAccessToken) };",
              'checkout replay token',
          )
          checkout = replace_once(
              checkout,
              "      const checkout = await db.transaction(async (tx) => {",
              "      const checkoutResult = await db.transaction(async (tx) => {",
              'checkout transaction result',
          )
          checkout = replace_once(
              checkout,
              "            accessTokenHash: idempotencyHash,\n            checkoutIdempotencyKey: idempotencyHash,",
              "            accessTokenHash: orderAccessHash,\n            checkoutIdempotencyKey: idempotencyHash,",
              'checkout separate hashes',
          )
          checkout = replace_once(
              checkout,
              """        return {
          orderId: order.id,
          orderNumber: order.orderNumber,
          paymentId: payment.id,
          totalAmount: subtotalAmount,
          paymentItems,
          expiresAt,
        };
      });

      try {""",
              """        return {
          orderId: order.id,
          orderNumber: order.orderNumber,
          paymentId: payment.id,
          totalAmount: subtotalAmount,
          paymentItems,
          expiresAt,
        };
      }).catch(async (error: unknown) => {
        const [replayed] = await db
          .select({ orderNumber: ordersTable.orderNumber })
          .from(ordersTable)
          .where(eq(ordersTable.checkoutIdempotencyKey, idempotencyHash))
          .limit(1);
        if (!replayed) throw error;
        return { replayedOrderNumber: replayed.orderNumber } as const;
      });

      if ('replayedOrderNumber' in checkoutResult) {
        reply.header('Cache-Control', 'no-store');
        return {
          data: await getOrderViewV2(checkoutResult.replayedOrderNumber, orderAccessToken),
        };
      }
      const checkout = checkoutResult;

      try {""",
              'checkout race replay',
          )
          checkout = replace_once(
              checkout,
              "data: await getOrderViewV2(checkout.orderNumber, idempotencyKey),",
              "data: await getOrderViewV2(checkout.orderNumber, orderAccessToken),",
              'checkout final token',
          )
          checkout = replace_once(
              checkout,
              """  app.get('/v2/orders/:orderNumber', async (request, reply) => {
    const orderNumber = orderNumberSchema.parse(
      (request.params as { orderNumber: string }).orderNumber,
    );
    const accessToken = idempotencyKeySchema.parse(requiredHeader(request, 'x-order-token'));
    reply.header('Cache-Control', 'no-store');
    return { data: await getOrderViewV2(orderNumber, accessToken) };
  });""",
              """  app.get(
    '/v2/orders/:orderNumber',
    {
      config: {
        rateLimit: { max: env.CHECKOUT_RATE_LIMIT_MAX, timeWindow: '1 minute' },
      },
    },
    async (request, reply) => {
      const orderNumber = orderNumberSchema.parse(
        (request.params as { orderNumber: string }).orderNumber,
      );
      const accessToken = idempotencyKeySchema.parse(requiredHeader(request, 'x-order-token'));
      reply.header('Cache-Control', 'no-store');
      return { data: await getOrderViewV2(orderNumber, accessToken) };
    },
  );""",
              'order lookup rate limit',
          )
          checkout_path.write_text(checkout)

          webhook_path = Path('src/routes/commerce.v2.webhook.routes.ts')
          webhook = webhook_path.read_text()
          webhook = replace_once(
              webhook,
              "  gte,\n  inventoryMovementsTable,",
              "  gte,\n  inArray,\n  inventoryMovementsTable,",
              'webhook import inArray',
          )
          webhook = replace_once(
              webhook,
              """        await tx
          .update(providerFulfillmentsTable)
          .set({ status: 'cancelled', nextAttemptAt: null, updatedAt: new Date() })
          .where(eq(providerFulfillmentsTable.orderId, payment.orderId));""",
              """        await tx
          .update(providerFulfillmentsTable)
          .set({ status: 'cancelled', nextAttemptAt: null, updatedAt: new Date() })
          .where(
            and(
              eq(providerFulfillmentsTable.orderId, payment.orderId),
              inArray(providerFulfillmentsTable.status, [
                'waiting_payment',
                'pending',
                'processing',
                'retrying',
              ]),
            ),
          );""",
              'webhook cancellation filter',
          )
          webhook = replace_once(
              webhook,
              """      if (nextStatus === 'refunded') {
        await tx
          .update(ordersTable)
          .set({ status: 'refunded', updatedAt: new Date() })
          .where(eq(ordersTable.id, payment.orderId));
      }""",
              """      if (nextStatus === 'refunded' && order.status !== 'refunded') {
        if (payment.terminalProcessedAt && paidOrderStates.has(order.status)) {
          const refundItems = await tx
            .select({
              variantId: orderItemsTable.variantId,
              quantity: orderItemsTable.quantity,
              fulfillmentStatus: providerFulfillmentsTable.status,
            })
            .from(orderItemsTable)
            .leftJoin(
              providerFulfillmentsTable,
              eq(providerFulfillmentsTable.orderItemId, orderItemsTable.id),
            )
            .where(eq(orderItemsTable.orderId, payment.orderId));

          for (const item of refundItems) {
            if (!item.variantId || item.fulfillmentStatus === 'succeeded') continue;
            await tx
              .update(inventoryTable)
              .set({
                onHand: sql`${inventoryTable.onHand} + ${item.quantity}`,
                updatedAt: new Date(),
              })
              .where(eq(inventoryTable.variantId, item.variantId));
            await tx.insert(inventoryMovementsTable).values({
              variantId: item.variantId,
              orderId: payment.orderId,
              type: 'return',
              quantityDelta: item.quantity,
              reason: 'Refund restored an undelivered digital item.',
              actor: 'midtrans-v2-webhook',
            });
          }
        }

        await tx
          .update(providerFulfillmentsTable)
          .set({ status: 'cancelled', nextAttemptAt: null, updatedAt: new Date() })
          .where(
            and(
              eq(providerFulfillmentsTable.orderId, payment.orderId),
              sql`${providerFulfillmentsTable.status} <> 'succeeded'`,
            ),
          );
        await tx
          .update(ordersTable)
          .set({ status: 'refunded', updatedAt: new Date() })
          .where(eq(ordersTable.id, payment.orderId));
      }""",
              'webhook refund compensation',
          )
          webhook_path.write_text(webhook)
          PY
      - run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            src/routes/commerce.v2.checkout.routes.ts \
            src/routes/commerce.v2.webhook.routes.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/commerce.v2.checkout.routes.ts src/routes/commerce.v2.webhook.routes.ts
          git commit -m "fix: harden Commerce v2 checkout and refund handling"
          git push origin HEAD:rebuild/commerce-v2-checkout-fulfillment
