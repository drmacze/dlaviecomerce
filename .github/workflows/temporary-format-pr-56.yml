name: Temporary format PR 56

on:
  push:
    branches:
      - feat/commerce-only-digiflazz-midtrans

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commerce-only-digiflazz-midtrans
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.28.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/commerce/digiflazz.ts src/config/env.ts src/routes/commerce.provider.routes.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/commerce/digiflazz.ts src/config/env.ts src/routes/commerce.provider.routes.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: apply provider formatting"
            git push origin HEAD:feat/commerce-only-digiflazz-midtrans
          fi
