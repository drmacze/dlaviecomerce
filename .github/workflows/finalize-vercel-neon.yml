name: One-time Vercel Neon Finalizer

on:
  push:
    branches: [feat/vercel-neon-embedded-commerce]
    paths: [.github/workflows/finalize-vercel-neon.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vercel-neon-embedded-commerce
          fetch-depth: 0

      - name: Route storefront and admin through embedded backend
        run: |
          python <<'PY'
          from pathlib import Path

          customer = Path('apps/www/app/api/commerce/[...path]/route.ts')
          text = customer.read_text()
          old_import = "import { commerceApiPath, CommerceConfigurationError } from '../../../../src/commerce/config';"
          new_import = """import {
            commerceBackendFetch,
            CommerceConfigurationError,
            EmbeddedCommerceConfigurationError,
          } from '../../../../src/commerce/backend';"""
          if old_import not in text:
              raise SystemExit('customer import not found')
          text = text.replace(old_import, new_import)

          start = text.index('  let target: URL;')
          end = text.index('  const headers = new Headers();', start)
          target = """  const backendPath = `/${resolution.backendPath
            .map((segment) => encodeURIComponent(segment))
            .join('/')}${new URL(request.url).search}`;

          """
          text = text[:start] + target + text[end:]

          declaration = text.index('  let upstream: Response;')
          start = text.index('  try {', declaration)
          end = text.index('  const bytes = await upstream.arrayBuffer();', start)
          request = """  try {
            upstream = await commerceBackendFetch(backendPath, {
              method: request.method,
              headers,
              ...(hasBody ? { body: await request.arrayBuffer() } : {}),
              origin: new URL(request.url).origin,
              timeoutMs: 20_000,
            });
          } catch (error) {
            const message =
              error instanceof CommerceConfigurationError ||
              error instanceof EmbeddedCommerceConfigurationError
                ? error.message
                : 'Commerce service is currently unreachable.';
            return errorResponse(503, 'SERVICE_UNAVAILABLE', message);
          }

          """
          customer.write_text(text[:start] + request + text[end:])

          admin = Path('apps/www/app/api/admin/commerce/[...path]/route.ts')
          text = admin.read_text()
          old_import = "import { commerceApiPath, CommerceConfigurationError } from '../../../../../src/commerce/config';"
          new_import = """import {
            commerceBackendFetch,
            CommerceConfigurationError,
            EmbeddedCommerceConfigurationError,
          } from '../../../../../src/commerce/backend';"""
          if old_import not in text:
              raise SystemExit('admin import not found')
          text = text.replace(old_import, new_import)

          start = text.index('    const target = commerceApiPath(')
          end = text.index('    const headers = new Headers', start)
          target = """    const backendPath = `/v1/admin/commerce/${path
              .map((segment) => encodeURIComponent(segment))
              .join('/')}${new URL(request.url).search}`;

          """
          text = text[:start] + target + text[end:]

          start = text.index('    const upstream = await fetch(')
          end = text.index('    const responseHeaders = new Headers', start)
          request = """    const upstream = await commerceBackendFetch(backendPath, {
              method: request.method,
              headers,
              ...(body ? { body } : {}),
              origin: new URL(request.url).origin,
              timeoutMs: 20_000,
            });
          """
          text = text[:start] + request + text[end:]
          text = text.replace(
              "error instanceof AdminSessionConfigurationError ||\n      error instanceof CommerceConfigurationError;",
              "error instanceof AdminSessionConfigurationError ||\n      error instanceof CommerceConfigurationError ||\n      error instanceof EmbeddedCommerceConfigurationError;",
          )
          admin.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Install and format
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            apps/www/app/api/commerce/[...path]/route.ts \
            apps/www/app/api/admin/commerce/[...path]/route.ts \
            apps/www/src/commerce/backend.ts \
            apps/www/src/commerce/embedded.ts \
            apps/www/src/commerce/server.ts \
            apps/www/next.config.ts \
            lib/db/src/migrate.ts

      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/www/app/api/commerce/[...path]/route.ts \
            apps/www/app/api/admin/commerce/[...path]/route.ts \
            apps/www/src/commerce/backend.ts \
            apps/www/src/commerce/embedded.ts \
            apps/www/src/commerce/server.ts \
            apps/www/next.config.ts \
            lib/db/src/migrate.ts
          git commit -m "feat(vercel): run commerce directly on Neon" || exit 0
          git pull --rebase origin feat/vercel-neon-embedded-commerce
          git push origin HEAD:feat/vercel-neon-embedded-commerce
