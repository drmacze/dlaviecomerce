name: One-time Vercel Neon Finalizer

on:
  push:
    branches: [feat/vercel-neon-embedded-commerce]
    paths: [.github/workflows/finalize-vercel-neon.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vercel-neon-embedded-commerce
          fetch-depth: 0

      - name: Route storefront and admin through embedded backend
        run: |
          python <<'PY'
          from pathlib import Path

          customer = Path('apps/www/app/api/commerce/[...path]/route.ts')
          text = customer.read_text()
          text = text.replace(
              "import { commerceApiPath, CommerceConfigurationError } from '../../../../src/commerce/config';",
              "import {\n  commerceBackendFetch,\n  CommerceConfigurationError,\n  EmbeddedCommerceConfigurationError,\n} from '../../../../src/commerce/backend';",
          )
          old_target = """  let target: URL;
          try {
            target = commerceApiPath(
              `/${resolution.backendPath.map((segment) => encodeURIComponent(segment)).join('/')}`,
            );
          } catch (error) {
            const message =
              error instanceof CommerceConfigurationError
                ? error.message
                : 'Commerce API configuration is invalid.';
            return errorResponse(503, 'SERVICE_UNAVAILABLE', message);
          }

          target.search = new URL(request.url).search;
          """
          new_target = """  const backendPath = `/${resolution.backendPath
            .map((segment) => encodeURIComponent(segment))
            .join('/')}${new URL(request.url).search}`;
          """
          if old_target not in text:
              raise SystemExit('customer target block not found')
          text = text.replace(old_target, new_target)
          old_fetch = """    upstream = await fetch(target, {
              method: request.method,
              headers,
              ...(hasBody ? { body: await request.arrayBuffer() } : {}),
              cache: 'no-store',
              redirect: 'manual',
              signal: AbortSignal.timeout(20_000),
            });
          } catch {
            return errorResponse(503, 'SERVICE_UNAVAILABLE', 'Commerce service is currently unreachable.');
          }
          """
          new_fetch = """    upstream = await commerceBackendFetch(backendPath, {
              method: request.method,
              headers,
              ...(hasBody ? { body: await request.arrayBuffer() } : {}),
              origin: new URL(request.url).origin,
              timeoutMs: 20_000,
            });
          } catch (error) {
            const message =
              error instanceof CommerceConfigurationError ||
              error instanceof EmbeddedCommerceConfigurationError
                ? error.message
                : 'Commerce service is currently unreachable.';
            return errorResponse(503, 'SERVICE_UNAVAILABLE', message);
          }
          """
          if old_fetch not in text:
              raise SystemExit('customer fetch block not found')
          customer.write_text(text.replace(old_fetch, new_fetch))

          admin = Path('apps/www/app/api/admin/commerce/[...path]/route.ts')
          text = admin.read_text()
          text = text.replace(
              "import { commerceApiPath, CommerceConfigurationError } from '../../../../../src/commerce/config';",
              "import {\n  commerceBackendFetch,\n  CommerceConfigurationError,\n  EmbeddedCommerceConfigurationError,\n} from '../../../../../src/commerce/backend';",
          )
          old_target = """    const target = commerceApiPath(
              `/v1/admin/commerce/${path.map((segment) => encodeURIComponent(segment)).join('/')}`,
            );
            target.search = new URL(request.url).search;
          """
          new_target = """    const backendPath = `/v1/admin/commerce/${path
              .map((segment) => encodeURIComponent(segment))
              .join('/')}${new URL(request.url).search}`;
          """
          if old_target not in text:
              raise SystemExit('admin target block not found')
          text = text.replace(old_target, new_target)
          old_fetch = """    const upstream = await fetch(target, {
              method: request.method,
              headers,
              ...(body ? { body } : {}),
              cache: 'no-store',
              redirect: 'manual',
              signal: AbortSignal.timeout(20_000),
            });
          """
          new_fetch = """    const upstream = await commerceBackendFetch(backendPath, {
              method: request.method,
              headers,
              ...(body ? { body } : {}),
              origin: new URL(request.url).origin,
              timeoutMs: 20_000,
            });
          """
          if old_fetch not in text:
              raise SystemExit('admin fetch block not found')
          text = text.replace(old_fetch, new_fetch)
          text = text.replace(
              "error instanceof AdminSessionConfigurationError ||\n      error instanceof CommerceConfigurationError;",
              "error instanceof AdminSessionConfigurationError ||\n      error instanceof CommerceConfigurationError ||\n      error instanceof EmbeddedCommerceConfigurationError;",
          )
          admin.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Install and format
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            apps/www/app/api/commerce/[...path]/route.ts \
            apps/www/app/api/admin/commerce/[...path]/route.ts \
            apps/www/src/commerce/backend.ts \
            apps/www/src/commerce/embedded.ts \
            apps/www/src/commerce/server.ts \
            apps/www/next.config.ts \
            lib/db/src/migrate.ts

      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/www/app/api/commerce/[...path]/route.ts \
            apps/www/app/api/admin/commerce/[...path]/route.ts \
            apps/www/src/commerce/backend.ts \
            apps/www/src/commerce/embedded.ts \
            apps/www/src/commerce/server.ts \
            apps/www/next.config.ts \
            lib/db/src/migrate.ts
          git commit -m "feat(vercel): run commerce directly on Neon" || exit 0
          git push origin HEAD:feat/vercel-neon-embedded-commerce
