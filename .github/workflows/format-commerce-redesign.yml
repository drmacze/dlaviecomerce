name: Format commerce redesign once

on:
  push:
    branches:
      - feat/commerce-professional-redesign
    paths:
      - .github/workflows/format-commerce-redesign.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commerce-professional-redesign

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format redesign files
        run: |
          pnpm exec prettier --write \
            apps/www/app/shop/page.tsx \
            apps/www/src/components/commerce/CommerceHeader.tsx \
            apps/www/src/styles/commerce.css

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/www/app/shop/page.tsx \
            apps/www/src/components/commerce/CommerceHeader.tsx \
            apps/www/src/styles/commerce.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format commerce redesign"
          git push origin HEAD:feat/commerce-professional-redesign
