name: Temporary Commerce Storefront Finalizer

on:
  pull_request:
    branches: [feat/commerce-core-production]
  push:
    branches: [feat/commerce-storefront]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout storefront branch
        uses: actions/checkout@v4
        with:
          ref: feat/commerce-storefront

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add commerce navigation link
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/www/app/page.tsx')
          content = path.read_text()
          anchor = '<a href="#os">DLavie OS</a>'
          commerce = '<a href="/shop">Commerce</a>'
          if commerce not in content:
              if content.count(anchor) != 1:
                  raise SystemExit('Primary DLavie OS navigation link is not unique.')
              content = content.replace(anchor, f"{anchor}\n{' ' * 14}{commerce}")
              path.write_text(content)
          PY

      - name: Format commerce storefront
        run: |
          pnpm exec prettier --write \
            apps/www/app/api/commerce \
            apps/www/app/cart \
            apps/www/app/checkout \
            apps/www/app/orders \
            apps/www/app/shop \
            apps/www/src/commerce \
            apps/www/src/components/commerce \
            apps/www/src/styles/commerce.css \
            apps/www/app/layout.tsx

      - name: Commit finalization
        run: |
          if git diff --quiet; then
            echo "Storefront is already finalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/www
          git commit -m "style(storefront): format commerce and link homepage"
          git push origin HEAD:feat/commerce-storefront
