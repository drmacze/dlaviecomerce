name: Temporary Commerce Home Link

on:
  push:
    branches: [feat/commerce-storefront]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout storefront branch
        uses: actions/checkout@v4
        with:
          ref: feat/commerce-storefront

      - name: Add commerce navigation link
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/www/app/page.tsx')
          content = path.read_text()
          old = '''            <div className="dlavie-home__nav-links">
              <a href="#os">DLavie OS</a>
              <a href="#ecosystem">Ecosystem</a>'''
          new = '''            <div className="dlavie-home__nav-links">
              <a href="#os">DLavie OS</a>
              <a href="/shop">Commerce</a>
              <a href="#ecosystem">Ecosystem</a>'''
          if content.count(old) != 1:
              raise SystemExit('Expected exactly one primary navigation block.')
          path.write_text(content.replace(old, new))
          PY

      - name: Commit navigation change
        run: |
          if git diff --quiet; then
            echo "Commerce link is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/www/app/page.tsx
          git commit -m "feat(storefront): link homepage to commerce"
          git push origin HEAD:feat/commerce-storefront
